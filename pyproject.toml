[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "primagate"
dynamic = ["version"]
description = "One call shape for LLM providers, embedded in your process."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Paul", email = "nrpaulsilas@gmail.com" }]
dependencies = [
    "httpx2>=2.13,<3",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://github.com/Paulerpro/PrimaGate"
Repository = "https://github.com/Paulerpro/PrimaGate"
Issues = "https://github.com/Paulerpro/PrimaGate/issues"
Documentation = "https://github.com/Paulerpro/PrimaGate/blob/main/README.md"

[project.optional-dependencies]
tokens = ["tiktoken>=0.14,<1"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.hatch.version]
path = "primagate/__init__.py"

[tool.hatch.build.targets.sdist]
# The lockfile pins dev and CI only; shipping it would look like a runtime constraint.
exclude = ["/uv.lock", "/.github"]

[tool.hatch.build.targets.wheel]
packages = ["primagate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live tests call real providers and cost money, so only `uv run pytest -m live` runs them.
addopts = "-m 'not live'"
markers = [
    "live: calls a real provider; deselected unless run with `-m live` (docs/live-conformance.md)",
    "fr(*ids): the FRs this conformance test proves, for example fr(\"FR7\")",
    "mode_independent(reason): this conformance test is not parametrized over sync and async mode; the reason says why",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "tiktoken"
# An optional extra, so it may not be installed where the type check runs.
ignore_missing_imports = true
