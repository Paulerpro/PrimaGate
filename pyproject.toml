[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "primagate"
dynamic = ["version"]
description = "One call shape for LLM providers, embedded in your process."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Paul", email = "nrpaulsilas@gmail.com" }]
dependencies = [
    "httpx2>=2.13,<3",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.14,<1"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.hatch.version]
path = "primagate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["primagate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "tiktoken"
# An optional extra, so it may not be installed where the type check runs.
ignore_missing_imports = true
